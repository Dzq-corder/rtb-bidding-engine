# RTB 投放引擎 · 性能测试专用 MySQL
#
# 用途：在独立的 MySQL 实例里做压测 / 千万级明细表 SQL 调优（M8 等），
#       不污染主链路用的 rtb-mysql。宿主端口同样用 3306，省去改连接配置，
#       但因此两者【不能同时在宿主 3306 上运行】，用前需先停掉另一个。
#
# 用法：
#   docker compose -f docker-compose.perf.yml up -d       启动性能测试库
#   docker compose -f docker-compose.perf.yml ps          确认 healthy
#   docker compose -f docker-compose.perf.yml down        停止（保留数据卷）
#   docker compose -f docker-compose.perf.yml down -v     停止并清空数据卷（慎用）
#
# 与 docker-compose.yml 的隔离点：
#   容器名    rtb-mysql-perf   （主库是 rtb-mysql）
#   宿主端口  3306             （与主库相同，故两者不能同时在宿主运行）
#   数据卷    mysql-perf-data  （主库是 mysql-data，各自独立不共享）
#   项目名    rtb-perf         （与主库 rtb 互不干扰）
#   注意：端口相同，启动时需先停掉另一个 MySQL，否则端口冲突。
#
# 连接信息（宿主侧）：
#   地址  localhost:3306
#   用户  root（空密码，仅本地演示）
#   库名  rtb（schema.sql 里硬编码 USE rtb，会自动建好）
#
# 调优说明（相比主库更激进，只为跑出干净的性能数字）：
#   - innodb-buffer-pool-size=2G：1000 万行明细表尽量留在内存，减少磁盘抖动
#   - skip-log-bin：关掉 binlog，纯写压测不再为复制付出 I/O 代价
#   - innodb-flush-log-at-trx-commit=2：每秒刷盘，写吞吐更高
#   - slow-query-log=1 / long-query-time=0.1：M8 调优时直接抓慢 SQL
#   - local-infile=1：造数脚本 LOAD DATA LOCAL INFILE 需要
#   注意：Docker Desktop 内存建议 >= 8GB，否则 2G buffer pool + 宿主 JVM 会 OOM。

name: rtb-perf

services:

  mysql-perf:
    image: mysql:8.0
    container_name: rtb-mysql-perf
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: rtb
      LANG: C.UTF-8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --local-infile=1
      - --max-connections=1000
      - --innodb-buffer-pool-size=2G
      - --innodb-log-file-size=512M
      - --innodb-flush-log-at-trx-commit=2
      - --skip-log-bin
      - --slow-query-log=1
      - --long-query-time=0.1
      - --performance-schema=ON
    volumes:
      # 造数 CSV 挂载点：import_seed_data.sh 用 LOAD DATA LOCAL INFILE 读 /data 下的文件
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  mysql-perf-data:
