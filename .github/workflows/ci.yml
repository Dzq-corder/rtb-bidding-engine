name: CI

# 触发时机：任意分支 push / 开 PR / 手动触发
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest          # 自带 Docker，支持 services

    services:
      # —— MySQL：与本地 docker-compose 一致（空密码 + rtb 库）——
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: rtb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      # —— Redis ——
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      # —— Kafka（KRaft 单节点，与 docker-compose 的 rtb2-kafka 一致）——
      # ADVERTISED_LISTENERS 必须为 localhost：否则宿主侧测试 JVM 拿到容器内部主机名，
      # 连不上（经典报错 Connection to node -1 could not be established）。
      kafka:
        image: apache/kafka:3.7.0
        env:
          CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
          # 单节点：副本/ISR 必须为 1，否则建 topic / 写会失败
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
        ports:
          - 9092:9092
        options: >-
          --health-cmd="/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven            # 缓存 ~/.m2，加速依赖下载

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Init schema
        run: mysql -h 127.0.0.1 -uroot rtb < sql/all-schema.sql

      - name: Run tests
        run: mvn -B test
