server:
  # 8080。若被占用可临时改端口，演示手册里的 curl 命令也要同步改
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 200
    max-connections: 8192

spring:
  application:
    name: rtb-engine

  datasource:
    # 本地演示环境不设密码，对应 docker-compose.yml 的 MYSQL_ALLOW_EMPTY_PASSWORD
    #
    # socketTimeout=3000：网络层保险丝。MySQL 驱动默认 0（无限等），一旦网络丢包/连接
    #   卡死，客户端会一直挂在 read 上——此时 MAX_EXECUTION_TIME 帮不了（SQL 没到服务端），
    #   MyBatis timeout 的取消也要另开连接发 KILL QUERY，同样发不出去。
    #   语义是「两次网络读之间的静默上限」，对非流式查询等同于语句总时长上限。
    #   取 3000 与 hikari.connection-timeout 对齐；比它更小的值会误伤后台报表/批量写。
    # connectTimeout=3000：建连阶段的 TCP 超时（默认 0 时，对端丢包会等到系统默认 20s+）。
    url: jdbc:mysql://127.0.0.1:3306/rtb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&socketTimeout=3000&connectTimeout=3000
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: rtbHikari
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      validation-timeout: 2000
      # 压测时打印的连接池指标来源
      leak-detection-threshold: 5000

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      # 预算扣减必须快，连接池适当放大
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 200ms
      timeout: 200ms

  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      # M6 启用。acks=all 配合幂等生产者，防止事件丢失与重复
      acks: all
      retries: 3
      # 显式指定 String 序列化（key=adId 分区键，value=事件 JSON）
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        linger.ms: 5
        batch.size: 32768
    consumer:
      group-id: rtb-engine
      auto-offset-reset: latest
      enable-auto-commit: false
      # 消费端手动提交位点，保证至少一次投递
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 500
    listener:
      # 手动提交，配合幂等实现「至少一次 + 最终只生效一次」
      ack-mode: manual_immediate

mybatis:
  configuration:
    # 展示 SQL 执行耗时，定位瓶颈用
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    # 全局语句超时（秒）。单位是「秒」，3 = 3000ms。
    # 竞价热路径 findCandidates 单独用 timeout="1" + MAX_EXECUTION_TIME(800) 收紧，不依赖这个全局值
    default-statement-timeout: 3
  mapper-locations: classpath:mapper/*.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: rtb-engine
  observations:
    key-values:
      application: rtb-engine

logging:
  level:
    root: INFO
    com.rtb: INFO
    # 压测时可临时调 DEBUG 看 SQL
    com.rtb.mapper: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

rtb:
  # ===== M5 超时与熔断配置 =====
  # 整条链路总超时预算（ms）：SLA 闸门，超过即放弃后续候选走兜底
  # M9 去线程池后，各依赖的超时不再由这里控制，而是下沉到驱动/SQL 层：
  #   · DB 候选检索：AdMapper.xml 的 MAX_EXECUTION_TIME(800) + timeout="1"
  #   · Redis 计费：spring.data.redis.timeout: 200ms（Lettuce 命令超时）
  timeout:
    total-ms: 1000
  circuit-breaker:
    # 连续失败达到该值 → OPEN（后续请求短路兜底）
    failure-threshold: 5
    # OPEN 冷却时长（ms），到期后 HALF_OPEN 放一个探活，成功自愈
    cooldown-ms: 5000
  fallback:
    # 兜底总开关。生产语义下恒为 true：任何失败都必须收敛到兜底广告。
    # 置 false 仅用于 A/B 对照实验——复现「没有兜底机制的旧实现」，
    # 所有失败出口直接返回空广告（hasAd=false），用来测量改造前的空广告率。
    enabled: true
    # 强制兜底开关：true 时所有请求直接返回兜底广告，用于复现「依赖全面故障」
    force: false
  detail:
    # M7 测量专用：true 时退化成同步单条 INSERT（模拟 M1 基线写入路径），
    # 用于产出「写吞吐由 A 提升至 B」的 A 值。正常压测与演示必须保持 false。
    sync-insert: false
  kafka:
    topic: bid_event
    partitions: 3
  budget:
    # 检索阶段预热的播种 key 存活时长（秒），默认 2 天；与 cleanup 的保留窗口互为兜底
    key-ttl-seconds: 172800
    cleanup:
      # 预算 key（budget:/spent:）按天分桶，写入未设 TTL，需定时清理旧日期 bucket，
      # 否则 Redis noeviction 被打满后写被拒 → 预算扣减失败。
      # 保留天数：保留「今天」往前共 N 天，清理更早的日期分桶（默认 2 = 保留今天+昨天，清掉前天及更早）
      retention-days: 2
      # 清理触发时间（cron：秒 分 时 日 月 周），默认每天 01:00
      cron: "0 0 1 * * ?"
