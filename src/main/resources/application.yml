server:
  # 8080。若被占用可临时改端口，演示手册里的 curl 命令也要同步改
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 200
    max-connections: 8192

spring:
  application:
    name: rtb-engine

  datasource:
    # 本地演示环境不设密码，对应 docker-compose.yml 的 MYSQL_ALLOW_EMPTY_PASSWORD
    url: jdbc:mysql://127.0.0.1:3306/rtb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: rtbHikari
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      validation-timeout: 2000
      # 压测时打印的连接池指标来源
      leak-detection-threshold: 5000

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      # 预算扣减必须快，连接池适当放大
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 200ms
      timeout: 200ms

  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      # M6 启用。acks=all 配合幂等生产者，防止事件丢失与重复
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        linger.ms: 5
        batch.size: 32768
    consumer:
      group-id: rtb-engine
      auto-offset-reset: latest
      enable-auto-commit: false
      # 消费端手动提交位点，保证至少一次投递
      max-poll-records: 500
    listener:
      # 手动提交，配合幂等实现「至少一次 + 最终只生效一次」
      ack-mode: manual_immediate

mybatis:
  configuration:
    # 展示 SQL 执行耗时，定位瓶颈用
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 5
  mapper-locations: classpath:mapper/*.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: rtb-engine
  observations:
    key-values:
      application: rtb-engine

logging:
  level:
    root: INFO
    com.rtb: INFO
    # 压测时可临时调 DEBUG 看 SQL
    com.rtb.mapper: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

rtb:
  # ===== M5 超时与熔断配置 =====
  # 整条链路总超时预算（ms）：SLA 闸门，超过即放弃后续步骤走兜底
  timeout:
    total-ms: 1000
    # DB 候选检索子预算（ms）：当前 m1-explore 线 M2 未完成，检索为全表扫(~250ms)，
    # 故设 800 留出余量让正常路径跑通；演示故障时可临时调小(如 10)触发超时兜底
    db-ms: 800
    # Redis 计费子预算（ms）
    redis-ms: 200
  circuit-breaker:
    # 连续失败达到该值 → OPEN（后续请求短路兜底）
    failure-threshold: 5
    # OPEN 冷却时长（ms），到期后 HALF_OPEN 放一个探活，成功自愈
    cooldown-ms: 5000
  fallback:
    # 强制兜底开关：true 时所有请求直接返回兜底广告，用于复现「依赖全面故障」
    force: false
  kafka:
    topic: bid_event
    partitions: 3
